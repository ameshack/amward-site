<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#223D3B" flood-opacity="0.07"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6A8B80"/></marker>
</defs>
<style>
  text{font-family:Inter,Arial,sans-serif;}
  .eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#65847A;}
  .heading{font-size:34px;font-weight:700;fill:#233B3B;}
  .sub{font-size:18px;fill:#58706B;}
  .h{font-size:21px;font-weight:700;fill:#233B3B;}
  .body{font-size:17px;fill:#425B55;}
  .small{font-size:15px;fill:#506963;}
  .whiteH{font-size:21px;font-weight:700;fill:white;}
  .whiteB{font-size:17px;fill:#EBF2ED;}
</style>
<rect x="0" y="0" width="1200" height="675" fill="#F5F3EE"/>
<rect x="34" y="34" width="1132" height="607" rx="20" fill="#F9F8F4" stroke="#E0E2D9"/>

<title id="title">Portfolio planning and resource allocation</title>
<desc id="desc">Annual program-lead consultation informs assessment of needs, budgets and capacity. The portfolio leader has final authority to determine support and allocate staff, agencies and budget across more than 20 services and technology products. In-year priorities can also be reconsidered.</desc>
<text x="78" y="90" class="eyebrow">EXECUTIVE OPERATING PARTNERSHIP</text>
<text x="78" y="142" class="heading">Portfolio planning &amp; resource allocation</text>
<text x="78" y="177" class="sub">An annual decision process with final authority over support and resources</text>
<!-- Arrows behind cards -->
<g stroke="#6A8B80" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M326 350 H350"/><path d="M598 350 H622"/><path d="M870 350 H894"/>
</g>
<!-- annual -->
<rect x="78" y="246" width="248" height="205" rx="14" fill="#FFFFFF" stroke="#CDD9D0" filter="url(#shadow)"/>
<rect x="78" y="246" width="248" height="8" rx="4" fill="#B5B7A4"/>
<circle cx="110" cy="288" r="19" fill="#E8EDE6"/><text x="110" y="295" font-size="18" font-weight="700" text-anchor="middle" fill="#37584E">1</text>
<text x="103" y="334" class="h">Program-lead input</text>
<text x="103" y="365" class="body">Annual consultations</text>
<text x="103" y="393" class="small">Support needs, projects,</text>
<text x="103" y="414" class="small">available program funds</text>
<!-- assessment -->
<rect x="350" y="246" width="248" height="205" rx="14" fill="#FFFFFF" stroke="#CDD9D0" filter="url(#shadow)"/>
<rect x="350" y="246" width="248" height="8" rx="4" fill="#B5B7A4"/>
<circle cx="382" cy="288" r="19" fill="#E8EDE6"/><text x="382" y="295" font-size="18" font-weight="700" text-anchor="middle" fill="#37584E">2</text>
<text x="375" y="334" class="h">Portfolio assessment</text>
<text x="375" y="365" class="body">Set priorities against</text>
<text x="375" y="393" class="small">budget, team capacity</text>
<text x="375" y="414" class="small">and agency resources</text>
<!-- final decisions highlighted -->
<rect x="622" y="246" width="248" height="205" rx="14" fill="#233B3B" filter="url(#shadow)"/>
<rect x="622" y="246" width="248" height="8" rx="4" fill="#AFCDBA"/>
<circle cx="654" cy="288" r="19" fill="#44645A"/><text x="654" y="295" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="647" y="334" class="whiteH">Final decisions</text>
<text x="647" y="365" class="whiteB">Which work to support;</text>
<text x="647" y="393" class="whiteB">what support to provide;</text>
<text x="647" y="416" class="whiteB">staff, agency &amp; budget</text>
<!-- deployment -->
<rect x="894" y="246" width="228" height="205" rx="14" fill="#FFFFFF" stroke="#CDD9D0" filter="url(#shadow)"/>
<rect x="894" y="246" width="228" height="8" rx="4" fill="#B5B7A4"/>
<circle cx="926" cy="288" r="19" fill="#E8EDE6"/><text x="926" y="295" font-size="18" font-weight="700" text-anchor="middle" fill="#37584E">4</text>
<text x="919" y="334" class="h">Deployment</text>
<text x="919" y="365" class="body">Resourced support for</text>
<text x="919" y="396" font-size="27" font-weight="700" fill="#233B3B">20+ </text>
<text x="983" y="396" class="small">services</text>
<text x="919" y="419" class="small">&amp; technology products</text>
<!-- Footer -->
<rect x="78" y="502" width="1044" height="72" rx="13" fill="#E8EDE6"/>
<path d="M117 523 C103 523 100 544 117 544 L140 544" stroke="#65847A" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="157" y="537" font-size="18" font-weight="700" fill="#2B4B43">In-year reprioritization</text>
<text x="157" y="560" font-size="16" fill="#4D675D">New or shifting departmental priorities were assessed and resourced as needs emerged.</text>
<text x="80" y="615" font-size="13" fill="#6D8078">Illustrative operating model based on actual decision rights; not a historical departmental process diagram.</text>
</svg>